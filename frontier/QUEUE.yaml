schema_version: 1
items:
  - id: frontier-kernel-001
    question: Can a packaged Genius-Mastery generate a fully self-validating descendant that passes its own validator without the Mastery source checkout?
    why_it_matters: Proves the teacher-forge creates independently operable descendants rather than hidden dependents.
    related_claims: [kernel-identity-001]
    dependencies: [Genius-Mastery]
    evidence_to_resolve:
      - generated descendant standalone validator PASS
      - generated descendant clean-checkout CI PASS
    status: open

  - id: frontier-synthesis-001
    question: How should semantic role synthesis expand beyond deterministic keyword inference while remaining inspectable, evidence-bound, and provider-independent?
    why_it_matters: A job title and desired outcomes should generate deep domain anatomy even when vocabulary does not match a hand-authored keyword.
    related_claims: []
    dependencies:
      - mastery.kernel.synthesize
      - mastery.kernel.anatomy-inspection
    evidence_to_resolve:
      - provider interface
      - comparative role-synthesis benchmark
      - transparent rationale for inferred capabilities
    status: open

  - id: frontier-discovery-001
    question: How can the forge automatically discover live models, tools, APIs, MCP servers, connectors, runtimes, devices, and artifact systems available to the executing agent?
    why_it_matters: Generated capability plans should reflect executable reality rather than generic assumptions.
    related_claims: []
    dependencies:
      - mastery.kernel.capability-sources
    evidence_to_resolve:
      - normalized runtime capability inventory
      - source/provider provenance
      - live readback tests
    status: open

  - id: frontier-graph-001
    question: How should recursive capability graphs represent substitutions, composition recipes, evidence, and multi-level emergent capability without flattening the lower layers?
    why_it_matters: The Genius ladder depends on higher capabilities becoming reusable objects for the next spiral.
    related_claims: []
    dependencies:
      - schemas/capability-graph.schema.json
      - src/genius/graph.py
    evidence_to_resolve:
      - multi-level composition fixture
      - graph referential-integrity tests
      - composition trace from primitive to higher capability
    status: open

  - id: frontier-impact-001
    question: How should mission-intelligence weights and evidence-strength calibration learn from observed mission outcomes without turning heuristic priority into fake certainty?
    why_it_matters: The 0.6.0 engine can rank work now; the next step is proving that its rankings remain useful across missions, counterexamples, and changing evidence quality.
    related_claims: [mission-intelligence-001]
    dependencies:
      - mastery.kernel.mission-intelligence
      - capability graph
    evidence_to_resolve:
      - counterexample and perturbation suite
      - mission-specific ranking benchmark
      - calibration trace comparing predicted leverage with observed outcomes
    status: open

  - id: frontier-teaching-001
    question: How should descendant reconstruction, transfer, explanation quality, and independence be measured and fed back into the forge?
    why_it_matters: Mastery is demonstrated by producing stronger practitioners, not static output.
    related_claims: []
    dependencies:
      - schemas/teaching.schema.json
      - mastery.kernel.synthesize
    evidence_to_resolve:
      - learner challenge harness
      - descendant outcome receipts
      - generator improvement trace
    status: open

  - id: frontier-family-001
    question: How should discovered cross-Genius candidates become execution-backed multi-Genius compositions and higher-order capabilities without losing provenance or creating a rigid hierarchy?
    why_it_matters: Local contract discovery now exists; mastery requires proving that composed entities create useful behavior greater than isolated capability descriptions.
    related_claims: [family-composition-001, family-synergy-001]
    dependencies:
      - mastery.kernel.family-composition
      - sibling Genius composition contracts
      - capability graph
    evidence_to_resolve:
      - at least one executed multi-Genius mission
      - comparative isolated-versus-composed benchmark
      - preserved provenance for each contributing capability
      - verified promotion rule for emergent higher capability
    status: open

  - id: frontier-migration-001
    question: What migration functions upgrade older Genius-family metadata and scaffolds while preserving all evidence IDs and domain-authored work?
    why_it_matters: The forge is evolving quickly and must improve descendants without destructive template replacement.
    related_claims: []
    dependencies: [Genius-Mastery]
    evidence_to_resolve:
      - lossless migration receipt
      - round-trip validation
      - preserved custom-domain content
    status: open
