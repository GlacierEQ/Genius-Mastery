schema_version: 1
release_model: core-complete-open-ended-mastery
items:
  - id: frontier-kernel-001
    question: Can a packaged Genius-Mastery generate a fully self-validating descendant without the Mastery source checkout?
    why_it_matters: Proves descendants do not secretly depend on the teacher source tree.
    related_claims: [kernel-identity-001]
    dependencies: [Genius-Mastery]
    evidence_to_resolve:
      - generated descendant standalone validator PASS
      - generated descendant clean isolated-environment CI PASS
    status: resolved
    release_blocker: false
    resolution: GitHub validation synthesizes a descendant and validates it in a fresh venv containing only PyYAML.

  - id: frontier-synthesis-001
    question: How should semantic role synthesis expand beyond deterministic keyword inference while remaining inspectable, evidence-bound, and provider-independent?
    why_it_matters: Deeper semantic synthesis can improve coverage when vocabulary does not match deterministic inference.
    related_claims: []
    dependencies: [mastery.kernel.synthesize, mastery.kernel.anatomy-inspection]
    status: research
    release_blocker: false

  - id: frontier-discovery-001
    question: How far should live capability discovery extend beyond the normalized local runtime, MCP-config, model, CLI, package, and integration-signal inventory?
    why_it_matters: Remote APIs, connectors, devices, and agent-host capabilities require provider-aware adapters and independent readback.
    related_claims: []
    dependencies: [mastery.kernel.capability-sources]
    status: research
    release_blocker: false
    core_resolution: Normalized local runtime inventory with provenance and secret-value non-disclosure is implemented.

  - id: frontier-graph-001
    question: How should recursive capability graphs promote verified compositions into multi-level emergent capabilities without flattening their dependencies?
    why_it_matters: Higher capabilities should become reusable graph objects while preserving lineage.
    related_claims: []
    dependencies: [schemas/capability-graph.schema.json, src/genius/graph.py]
    status: research
    release_blocker: false
    core_resolution: Dependency metadata, reference nodes, mission intelligence, graph rebuild, and referential validation are implemented.

  - id: frontier-impact-001
    question: How should ranking weights learn from observed mission outcomes without turning heuristic priority into fake certainty?
    why_it_matters: Synthetic perturbation calibration establishes monotonic sanity; real outcome learning is separate research.
    related_claims: [mission-intelligence-001]
    dependencies: [mastery.kernel.mission-intelligence]
    status: research
    release_blocker: false
    core_resolution: Deterministic counterexample and perturbation calibration is implemented and tested.

  - id: frontier-teaching-001
    question: How should descendant reconstruction, transfer, explanation quality, and independence be measured and fed back into the forge?
    why_it_matters: Real learner outcomes are required for empirical teaching-quality improvement.
    related_claims: []
    dependencies: [schemas/teaching.schema.json, mastery.kernel.synthesize]
    status: research
    release_blocker: false
    core_resolution: Teaching contracts, transfer challenges, standalone descendants, and executable challenge primitives are implemented.

  - id: frontier-family-001
    question: How should contract-compatible Genius entities prove emergent multi-Genius mission behavior greater than isolated execution?
    why_it_matters: Contract composition is executable and receipted; emergent domain behavior requires real mission benchmarks.
    related_claims: [family-composition-001, family-synergy-001]
    dependencies: [mastery.kernel.family-composition, sibling Genius composition contracts]
    status: research
    release_blocker: false
    core_resolution: Deterministic execution-backed contract composition receipts and isolated-versus-combined capability visibility are implemented.

  - id: frontier-migration-001
    question: What migration functions upgrade older Genius-family metadata and scaffolds while preserving evidence IDs and domain-authored work?
    why_it_matters: Family evolution must not destructively replace descendant work.
    related_claims: []
    dependencies: [Genius-Mastery]
    status: resolved
    release_blocker: false
    resolution: Lossless v1-to-v2 migration preserves custom content and IDs, backfills missing surfaces, emits hashes, and is idempotent.

  - id: frontier-instruction-001
    question: How should Genius learn model-specific instruction projections from representative execution trajectories without confusing prompt optimization with capability proof?
    why_it_matters: The 1.1 compiler makes instruction contracts explicit and auditable; empirical trajectory feedback is required to optimize projections across model families without prompt folklore or vanity scoring.
    related_claims: [instruction-contract-001]
    dependencies: [mastery.kernel.instruction-engineering]
    evidence_to_resolve:
      - representative multi-model task suites with versioned baselines
      - trajectory failure clustering tied to owning runtime layers
      - regression proof that optimized projections preserve required quality and safety
    status: research
    release_blocker: false
    core_resolution: Typed contract compilation, trust boundaries, structural diagnostics, and model-family labeling are implemented and regression-tested.

