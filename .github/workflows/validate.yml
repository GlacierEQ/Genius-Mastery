name: validate-contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Compile Python surfaces
        run: python -m compileall -q src tools

      - name: Validate Mastery contracts
        run: |
          genius validate .
          genius doctor .
          python tools/validate.py .
          python tools/doctor.py .

      - name: Configure independent Node 22 product runner
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run regression suite
        run: pytest -q

      - name: Independent TypeScript web/API acceptance mission
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          genius foundry new --name Taskboard --profile typescript-taskboard \
            --objective "Create a local task manager with browser UI, persistent JSON store, HTTP CRUD and real integration tests" \
            --dest "$workspace"
          cd "$workspace/Genius-Taskboard"
          npm ci --offline --ignore-scripts --no-audit
          npm test
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.8.3 @types/node@22.15.3
          npm run typecheck
          test -s dist/server.js
          test -s public/index.html
          test -s source-manifest.json
          node -e 'const m=require("./source-manifest.json"); if(m.status!=="GENERATED_UNVERIFIED") process.exit(1)'


      - name: Exercise forge and mission intelligence
        run: |
          rm -rf /tmp/Genius-SmokeTest /tmp/Genius-Researcher
          genius --version
          genius name "Distributed Systems" | grep -q '^Genius-Distributed-Systems$'
          genius new SmokeTest --dest /tmp
          genius validate /tmp/Genius-SmokeTest
          genius synthesize Researcher --outcome "Indiana Jones" --dest /tmp
          genius validate /tmp/Genius-Researcher
          genius analyze /tmp/Genius-Researcher --top 5 --write
          python - <<'PY2'
          from pathlib import Path
          import yaml

          graph = yaml.safe_load(
              Path("/tmp/Genius-Researcher/capabilities/GRAPH.yaml").read_text(
                  encoding="utf-8"
              )
          )
          analysis = graph.get("analysis") or {}
          assert analysis.get("engine") == "mission-intelligence-v1", analysis
          assert analysis.get("ranked_priorities"), analysis
          assert analysis.get("top_next_actions"), analysis
          PY2

      - name: Verify a genuinely independent Lineage package and its functional behavior
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          envdir="$(mktemp -d)"
          genius forge aerospace --dest "$workspace"
          python -m venv "$envdir/venv"
          "$envdir/venv/bin/python" -m pip install --disable-pip-version-check -e "$workspace/Genius-Aerospace" "pytest>=8"
          cd "$workspace/Genius-Aerospace"
          "$envdir/venv/bin/python" -m pytest -q tests
          "$envdir/venv/bin/python" - <<'PY'
          import json
          import math
          from pathlib import Path
          from genius_aerospace.tools import tsiolkovsky_delta_v, orbital_period

          assert math.isclose(tsiolkovsky_delta_v(300.0, 1000.0, 500.0),
                              300.0 * 9.80665 * math.log(2), rel_tol=1e-12)
          assert orbital_period(7000.0) > 5000
          try:
              tsiolkovsky_delta_v(300.0, 0.0, 500.0)
          except ValueError:
              pass
          else:
              raise AssertionError("invalid mass must fail")
          manifest = json.loads(Path("evidence/MANIFEST.json").read_text())
          assert manifest["verification_state"] == "generated_unverified"
          assert len(manifest["files"]) > 5
          print("Independently installed descendant: native tests and functional smoke passed")
          PY
          if "$envdir/venv/bin/python" -m pip show genius-mastery >/dev/null 2>&1; then
            echo "Generated package unexpectedly depends on the Mastery checkout" >&2
            exit 1
          fi

      - name: Exercise family analyzer
        run: genius family . --top 3

      - name: Prove generated descendant independence
        run: |
          rm -rf /tmp/Genius-Independent /tmp/genius-independent-venv
          genius synthesize Independent --outcome "standalone validation" --dest /tmp
          python -m venv /tmp/genius-independent-venv
          /tmp/genius-independent-venv/bin/pip install pyyaml
          cd /tmp/Genius-Independent
          env -i PATH="/tmp/genius-independent-venv/bin:/usr/bin:/bin" HOME="$HOME" /tmp/genius-independent-venv/bin/python tools/validate.py .

      - name: Generate inspectable Business Process Automation specialist
        run: |
          rm -rf /tmp/Genius-Business-Process-Automation
          genius synthesize "Business Process Automation" \
            --outcome "workflow automation with idempotency and provider verification" \
            --outcome "stateful recovery, memory and approval gates" \
            --monolith-catalog tests/fixtures/monolith_role_smoke.json \
            --dest /tmp
          genius validate /tmp/Genius-Business-Process-Automation
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path("/tmp/Genius-Business-Process-Automation")
          mapping = yaml.safe_load((root / "capabilities/ESTATE_DISCOVERY.yaml").read_text())
          plan = yaml.safe_load((root / "synthesis/PLAN.yaml").read_text())
          assert mapping["catalog_version"] == "test-fixture"
          assert mapping["matching_intents"]
          assert all(hit["evidence_state"] == "catalog-pointer-unverified" for hit in mapping["matching_intents"])
          assert plan["synthesis_state"] == "mapped"
          print("Synthetic BPA compiler output validated; no live capability asserted")
          PY
          mkdir -p .verification-artifacts
          cp -a /tmp/Genius-Business-Process-Automation .verification-artifacts/bpa-synthetic-output

      - name: Preserve generated specialist smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: genius-bpa-synthetic-smoke
          path: .verification-artifacts/bpa-synthetic-output
          retention-days: 7
          if-no-files-found: error

      - name: Exercise completion mechanisms
        run: |
          genius discover . --write
          test -s capabilities/RUNTIME_INVENTORY.yaml
          genius calibrate .
          genius rebuild-graph .
          genius validate .
          genius progress . --mission "Advance the strongest remaining Mastery bottleneck" --json > /tmp/progress.json
          test -s /tmp/progress.json
          genius closure .
