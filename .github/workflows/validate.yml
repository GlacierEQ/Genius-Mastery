name: validate-contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Compile Python surfaces
        run: python -m compileall -q src tools

      - name: Validate Mastery contracts
        run: |
          genius validate .
          genius doctor .
          python tools/validate.py .
          python tools/doctor.py .

      - name: Run regression suite
        run: pytest -q

      - name: Exercise forge and mission intelligence
        run: |
          rm -rf /tmp/Genius-SmokeTest /tmp/Genius-Researcher
          genius --version
          genius name "Distributed Systems" | grep -q '^Genius-Distributed-Systems$'
          genius new SmokeTest --dest /tmp
          genius validate /tmp/Genius-SmokeTest
          genius synthesize Researcher --outcome "Indiana Jones" --dest /tmp
          genius validate /tmp/Genius-Researcher
          genius analyze /tmp/Genius-Researcher --top 5 --write
          python - <<'PY'
          from pathlib import Path
          import yaml

          graph = yaml.safe_load(
              Path("/tmp/Genius-Researcher/capabilities/GRAPH.yaml").read_text(
                  encoding="utf-8"
              )
          )
          analysis = graph.get("analysis") or {}
          assert analysis.get("engine") == "mission-intelligence-v1", analysis
          assert analysis.get("ranked_priorities"), analysis
          assert analysis.get("top_next_actions"), analysis
          PY

      - name: Exercise family analyzer
        run: genius family . --top 3

      - name: Prove generated descendant independence
        run: |
          rm -rf /tmp/Genius-Independent /tmp/genius-independent-venv
          genius synthesize Independent --outcome "standalone validation" --dest /tmp
          python -m venv /tmp/genius-independent-venv
          /tmp/genius-independent-venv/bin/pip install pyyaml
          cd /tmp/Genius-Independent
          env -i PATH="/tmp/genius-independent-venv/bin:/usr/bin:/bin" HOME="$HOME" \
            /tmp/genius-independent-venv/bin/python tools/validate.py .

      - name: Exercise completion mechanisms
        run: |
          genius discover . --write
          test -s capabilities/RUNTIME_INVENTORY.yaml
          genius calibrate .
          genius rebuild-graph .
          genius validate .
          genius progress . --mission "Advance the strongest remaining Mastery bottleneck" --json > /tmp/progress.json
          test -s /tmp/progress.json
          genius closure .
