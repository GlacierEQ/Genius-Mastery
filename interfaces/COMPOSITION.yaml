spec_version: 1
repository: Genius-Mastery
provides:
  - id: mastery.kernel.schemas
    description: JSON Schema contracts for GENIUS.yaml, claims, evidence, sources, challenges, composition, and universal capability anatomy
    stage: mapped
    interface: schemas/
    evidence_refs: []
  - id: mastery.kernel.capability-anatomy
    description: Kernel-up entity anatomy for decomposing any action or capability from physical substrate through real-world effect and retained gain
    stage: implemented
    interface: docs/GENIUS_ENTITY_ANATOMY.md
    evidence_refs: []
  - id: mastery.kernel.capability-schema
    description: Machine-readable universal capability contract with vertical layers, dependencies, action semantics, verification, mission impact, and evolution
    stage: implemented
    interface: schemas/capability.schema.json
    evidence_refs: []
  - id: mastery.kernel.capability-template
    description: Human-editable universal do-stuff template for instantiating a capability anatomy in any Genius domain
    stage: implemented
    interface: templates/CAPABILITY.yaml
    evidence_refs: []
  - id: mastery.kernel.synthesize
    description: Role-to-entity teacher forge that expands a thin job title and desired outcomes into a purpose-built Genius repository with persona, vertical anatomy, teaching plan, capability search targets, mastery map, and frontier
    stage: implemented
    interface: src/genius/synthesize.py
    evidence_refs: []
  - id: mastery.kernel.capability-sources
    description: Registry of live reusable capability sources including Mega Skills, sibling Genius entities, runtime tools/connectors/models, and authoritative research
    stage: implemented
    interface: sources/CAPABILITY_SOURCES.yaml
    evidence_refs: []
  - id: mastery.kernel.capability-source-adapter
    description: Reference-only adapter that matches role briefs against real Skills, Combo Skills, and Mega Skills registries when a checkout is available
    stage: implemented
    interface: src/genius/sources.py
    evidence_refs: []
  - id: mastery.kernel.anatomy-inspection
    description: Universal kernel-up inspection prompts that force synthesized entities to interrogate every capability layer before deciding mission relevance
    stage: implemented
    interface: src/genius/anatomy.py
    evidence_refs: []
  - id: mastery.kernel.teaching-contract
    description: Machine-readable contract for explanation, demonstration, blank-state reconstruction, transfer, learner verification, and teaching outcome metrics
    stage: implemented
    interface: schemas/teaching.schema.json
    evidence_refs: []
  - id: mastery.kernel.validate
    description: Local contract + referential integrity validator
    stage: mapped
    interface: tools/validate.py
    evidence_refs: []
  - id: mastery.kernel.doctor
    description: Diagnostic surface for vector, claims, evidence, frontier
    stage: mapped
    interface: tools/doctor.py
    evidence_refs: []
  - id: mastery.ci.buildkite.contract
    description: Fail-closed Genius-family Buildkite execution contract with exact-source terminal receipts and proof-artifact digests
    stage: operational
    interface: .buildkite/pipeline.yml
    evidence_refs:
      - ev-bk-mastery-001
      - ev-bk-mastery-002
  - id: mastery.ci.receipt
    description: Credential-free terminal CI receipt generator binding Buildkite identity, exact Git source, and proof artifact SHA-256 digests
    stage: operational
    interface: tools/buildkite_receipt.py
    evidence_refs:
      - ev-bk-mastery-002
consumes:
  - repository: apex-control-plane
    capability: execution.buildkite.genius-family
    reason: APEX owns live Buildkite organization, cluster, webhook, and exact-head pipeline reconciliation.
