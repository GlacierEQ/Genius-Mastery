env:
  PYTHON_VERSION: "3.13"

steps:
  - label: ":python: Install & validate contract"
    key: validate
    command:
      - pip install -e ".[dev]" pyyaml pytest
      - genius validate .
      - genius doctor .
      - python tools/validate.py .
    plugins:
      - docker#v5.12.0:
          image: "python:3.13-slim"
          always-pull: true
          workdir: /workdir
          volumes:
            - "./:/workdir"

  - label: ":pytest: Unit tests"
    key: unit
    depends_on: validate
    command:
      - pip install -e ".[dev]" pyyaml pytest
      - pytest -q
    plugins:
      - docker#v5.12.0:
          image: "python:3.13-slim"
          always-pull: true
          workdir: /workdir
          volumes:
            - "./:/workdir"

  - label: ":hammer: CLI smoke (name / new / validate scaffold)"
    key: cli-smoke
    depends_on: validate
    command:
      - pip install -e .
      - genius name "Distributed Systems" | grep -q Genius-Distributed-Systems
      - genius new SmokeTest --dest /tmp
      - genius validate /tmp/Genius-SmokeTest
      - rm -rf /tmp/Genius-SmokeTest
    plugins:
      - docker#v5.12.0:
          image: "python:3.13-slim"
          always-pull: true
          workdir: /workdir
          volumes:
            - "./:/workdir"
