env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

agents:
  queue: macos-self

steps:
  - label: ":microscope: Mastery 1.0 native verification"
    key: verify
    timeout_in_minutes: 15
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command: |
      set -euo pipefail

      VENV=".buildkite-venv"
      cleanup() {
        rm -rf "$VENV" /tmp/Genius-SmokeTest /tmp/Genius-Researcher
      }
      trap cleanup EXIT
      cleanup

      python3 --version
      python3 -m venv "$VENV"
      . "$VENV/bin/activate"

      python -m pip install -e ".[dev]"
      python -m compileall -q src tools

      genius --version
      genius validate .
      genius doctor .
      python tools/validate.py .
      python tools/doctor.py .

      mkdir -p .verification-artifacts
      pytest -q --junitxml=.verification-artifacts/junit.xml

      genius name "Distributed Systems" | grep -q '^Genius-Distributed-Systems$'
      genius new SmokeTest --dest /tmp
      genius validate /tmp/Genius-SmokeTest

      genius synthesize Researcher \
        --outcome "Indiana Jones" \
        --dest /tmp
      genius validate /tmp/Genius-Researcher
      genius analyze /tmp/Genius-Researcher --top 5 --write
      genius family . --top 3
      genius discover . --write
      genius calibrate .
      genius rebuild-graph .
      genius validate .
      genius vector . --write
      genius closure .
      cp mastery/VECTOR.yaml .verification-artifacts/mastery-vector.yaml

      python - <<'PY'
      from pathlib import Path
      import yaml

      graph = yaml.safe_load(
          Path("/tmp/Genius-Researcher/capabilities/GRAPH.yaml").read_text(
              encoding="utf-8"
          )
      )
      analysis = graph.get("analysis") or {}
      assert analysis.get("engine") == "mission-intelligence-v1", analysis
      assert analysis.get("ranked_priorities"), analysis
      assert analysis.get("top_next_actions"), analysis
      print(
          "verified mission intelligence:",
          analysis["top_next_actions"][0]["id"],
      )

      vector = yaml.safe_load(
          Path(".verification-artifacts/mastery-vector.yaml").read_text(
              encoding="utf-8"
          )
      )
      assert vector["integrity"]["clean"] is True, vector["integrity"]
      assert vector["totals"]["claims"] >= 10, vector["totals"]
      print("verified mastery vector:", vector["totals"])
      PY

      python tools/buildkite_receipt.py \
        --repository genius-mastery \
        --artifact .verification-artifacts/junit.xml \
        --proof .verification-artifacts/mastery-vector.yaml
    artifact_paths:
      - ".verification-artifacts/junit.xml"
      - ".verification-artifacts/mastery-vector.yaml"
      - ".verification-artifacts/buildkite-verified-receipt.json"
      - ".verification-artifacts/buildkite-verified-receipt.json.sha256"
