env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

steps:
  - label: ":python: Contract + doctor"
    key: validate
    timeout_in_minutes: 10
    command:
      - python --version
      - pip install -e ".[dev]"
      - genius validate .
      - genius doctor .
      - python tools/validate.py .
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true

  - label: ":pytest: Unit tests"
    key: unit
    depends_on: validate
    timeout_in_minutes: 10
    command:
      - pip install -e ".[dev]"
      - pytest -q
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true

  - label: ":hammer: CLI smoke"
    key: cli-smoke
    depends_on: validate
    timeout_in_minutes: 10
    command:
      - pip install -e .
      - genius name "Distributed Systems" | grep -q '^Genius-Distributed-Systems$'
      - genius new SmokeTest --dest /tmp
      - genius validate /tmp/Genius-SmokeTest
      - rm -rf /tmp/Genius-SmokeTest
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
