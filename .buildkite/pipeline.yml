env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

agents:
  queue: macos-self
  os: macos

steps:
  - label: ":lock: Exact source + pipeline preflight"
    key: source-preflight
    timeout_in_minutes: 5
    command: |
      set -euo pipefail
      actual="$(git rev-parse HEAD)"
      test "$actual" = "$BUILDKITE_COMMIT"
      test "$BUILDKITE_PIPELINE_SLUG" = "genius-mastery"
      git diff --exit-code
      help="$(buildkite-agent pipeline upload --help 2>&1)"
      set -- pipeline upload .buildkite/pipeline.yml
      printf '%s' "$help" | grep -q -- '--reject-parse-warnings' && set -- "$@" --reject-parse-warnings || true
      printf '%s' "$help" | grep -q -- '--reject-secrets' && set -- "$@" --reject-secrets || true
      if printf '%s' "$help" | grep -q -- '--dry-run'; then
        buildkite-agent "$@" --dry-run >/dev/null
      fi

  - label: ":python: Contract + doctor"
    key: validate
    depends_on: source-preflight
    timeout_in_minutes: 10
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command:
      - python --version
      - pip install -e ".[dev]"
      - genius validate .
      - genius doctor .
      - python tools/validate.py .
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          pull-retries: 2

  - label: ":pytest: Unit tests"
    key: unit
    depends_on: validate
    timeout_in_minutes: 10
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command:
      - pip install -e ".[dev]"
      - mkdir -p .verification-artifacts
      - pytest -q --junitxml=.verification-artifacts/junit.xml
      - sha256sum .verification-artifacts/junit.xml > .verification-artifacts/junit.xml.sha256
    artifact_paths:
      - ".verification-artifacts/junit.xml"
      - ".verification-artifacts/junit.xml.sha256"
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          pull-retries: 2

  - label: ":hammer: CLI smoke"
    key: cli-smoke
    depends_on: validate
    timeout_in_minutes: 10
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command:
      - pip install -e .
      - genius name "Distributed Systems" | grep -q '^Genius-Distributed-Systems$'
      - genius new SmokeTest --dest /tmp
      - genius validate /tmp/Genius-SmokeTest
      - rm -rf /tmp/Genius-SmokeTest
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          pull-retries: 2

  - label: ":receipt: Verified terminal receipt"
    key: receipt
    depends_on:
      - unit
      - cli-smoke
    timeout_in_minutes: 5
    command: |
      set -euo pipefail
      python3 tools/buildkite_receipt.py --repository Genius-Mastery --output artifacts/buildkite/verified-ci-receipt.json
    artifact_paths:
      - "artifacts/buildkite/verified-ci-receipt.json"
      - "artifacts/buildkite/verified-ci-receipt.json.sha256"
