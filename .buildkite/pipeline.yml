env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

agents:
  queue: macos-self
  os: macos

steps:
  - label: ":microscope: Mastery verification"
    key: verify
    timeout_in_minutes: 15
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command: |
      set -euo pipefail
      python --version
      python - <<'PY'
      import os
      commit = os.environ.get("BUILDKITE_COMMIT", "")
      pipeline = os.environ.get("BUILDKITE_PIPELINE_SLUG", "")
      assert len(commit) == 40, commit
      assert pipeline == "genius-mastery", pipeline
      PY
      pip install -e ".[dev]"
      genius validate .
      genius doctor .
      python tools/validate.py .
      python -m py_compile tools/buildkite_receipt.py
      mkdir -p .verification-artifacts
      pytest -q --junitxml=.verification-artifacts/junit.xml
      genius name "Distributed Systems" | grep -q '^Genius-Distributed-Systems$'
      genius new SmokeTest --dest /tmp
      genius validate /tmp/Genius-SmokeTest
      rm -rf /tmp/Genius-SmokeTest
      sha256sum .verification-artifacts/junit.xml > .verification-artifacts/junit.xml.sha256
    artifact_paths:
      - ".verification-artifacts/junit.xml"
      - ".verification-artifacts/junit.xml.sha256"
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          pull-retries: 2
          environment:
            - "BUILDKITE_COMMIT"
            - "BUILDKITE_PIPELINE_SLUG"

  - label: ":receipt: Terminal evidence receipt"
    key: receipt
    depends_on: verify
    timeout_in_minutes: 5
    command: |
      set -euo pipefail
      python3 tools/buildkite_receipt.py \
        --repository Genius-Mastery \
        --output artifacts/buildkite/verified-ci-receipt.json \
        --proof .buildkite/pipeline.yml \
        --proof .verification-artifacts/junit.xml
    artifact_paths:
      - "artifacts/buildkite/verified-ci-receipt.json"
      - "artifacts/buildkite/verified-ci-receipt.json.sha256"
