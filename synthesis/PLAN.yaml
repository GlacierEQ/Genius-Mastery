      - dependency graph compilation
      - capability algebra
      - alternate-route discovery
      - mission-sensitive importance
      - downstream leverage
  - id: forge-learning
    status: frontier
    targets:
      - descendant outcome telemetry
      - synthesis quality evaluation
      - generator improvement from evidence

